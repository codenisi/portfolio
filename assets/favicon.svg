<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>
  </defs>
  <!-- Rounded Base Background -->
  <rect width="64" height="64" rx="16" fill="#0a0f1d" />
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#grad)" stroke-width="2" opacity="0.6" />
  
  <!-- Cyber Hexagon Motif -->
  <polygon points="32,10 52,22 52,44 32,54 12,44 12,22" fill="none" stroke="url(#grad)" stroke-width="2" stroke-dasharray="2 3" opacity="0.4" />
  
  <!-- Monogram BAN Text -->
  <text x="32" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="url(#grad)" text-anchor="middle" letter-spacing="1">BAN</text>
  
  <!-- Shield/Tech Accent Dot -->
  <circle cx="32" cy="47" r="2.5" fill="#38bdf8" />
</svg>
